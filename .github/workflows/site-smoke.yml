name: site-smoke

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source tree
        run: ./scripts/ci-site.sh

  production-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify public website
        run: ./scripts/ci-site.sh https://hivra.space/
