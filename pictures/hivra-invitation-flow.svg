<svg width="1600" height="2200" viewBox="0 0 1600 2200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgVertical" x1="800" y1="0" x2="800" y2="2200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B10"/>
      <stop offset="0.52" stop-color="#0B1018"/>
      <stop offset="1" stop-color="#07090E"/>
    </linearGradient>
    <radialGradient id="bgGlowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(796 300) rotate(90) scale(420 660)">
      <stop stop-color="#FFB25D" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFB25D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1190 860) rotate(90) scale(560 520)">
      <stop stop-color="#86F58A" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#86F58A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowLower" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 1630) rotate(90) scale(520 760)">
      <stop stop-color="#D68DFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D68DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FFD56A"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#71D8CF"/>
      <stop offset="1" stop-color="#9CFB78"/>
    </linearGradient>
    <linearGradient id="purpleLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#CB84FF"/>
      <stop offset="1" stop-color="#FF90DC"/>
    </linearGradient>
    <linearGradient id="burnLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF7A47"/>
      <stop offset="1" stop-color="#FFAA5F"/>
    </linearGradient>
    <linearGradient id="cardAmber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22150D"/>
      <stop offset="1" stop-color="#16161A"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10211A"/>
      <stop offset="1" stop-color="#14171D"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1A1425"/>
      <stop offset="1" stop-color="#15161B"/>
    </linearGradient>
    <linearGradient id="cardBurn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#25120F"/>
      <stop offset="1" stop-color="#181418"/>
    </linearGradient>
    <filter id="softGlow" x="-200" y="-200" width="2000" height="2600" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="cardShadow" x="-40" y="-40" width="500" height="340" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="titleGlow" x="0" y="0" width="1600" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#FFB868" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowAmber" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M2 2L14 8L2 14V2Z" fill="#FFD56A"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M2 2L14 8L2 14V2Z" fill="#96F88B"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M2 2L14 8L2 14V2Z" fill="#E3A3FF"/>
    </marker>
    <marker id="arrowBurn" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M2 2L14 8L2 14V2Z" fill="#FF9E63"/>
    </marker>
  </defs>

  <rect width="1600" height="2200" fill="url(#bgVertical)"/>
  <rect width="1600" height="2200" fill="url(#bgGlowTop)"/>
  <rect width="1600" height="2200" fill="url(#bgGlowRight)"/>
  <rect width="1600" height="2200" fill="url(#bgGlowLower)"/>

  <g opacity="0.5" filter="url(#softGlow)">
    <circle cx="240" cy="300" r="2" fill="#FFB868"/>
    <circle cx="460" cy="150" r="2" fill="#FFD087"/>
    <circle cx="1320" cy="290" r="2" fill="#B7FFA0"/>
    <circle cx="1220" cy="690" r="2" fill="#9CFB78"/>
    <circle cx="340" cy="1290" r="2" fill="#FFB868"/>
    <circle cx="980" cy="1720" r="2" fill="#D68DFF"/>
    <circle cx="1280" cy="1660" r="2" fill="#96F88B"/>
    <circle cx="720" cy="980" r="2" fill="#FFFFFF"/>
    <circle cx="820" cy="1120" r="2" fill="#FFFFFF"/>
    <circle cx="180" cy="1820" r="2" fill="#FFB868"/>
    <circle cx="1450" cy="2020" r="2" fill="#9CFB78"/>
  </g>

  <g filter="url(#titleGlow)">
    <circle cx="800" cy="132" r="40" fill="#171111" stroke="#FFB45C" stroke-width="3"/>
    <path d="M800 100L828 114V148C828 172 807 186 800 190C793 186 772 172 772 148V114L800 100Z" fill="#FFD56A"/>
    <path d="M800 114V178" stroke="#24180A" stroke-width="4"/>
    <path d="M800 114H828" stroke="#24180A" stroke-width="4"/>
    <circle cx="800" cy="132" r="74" stroke="#FFB45C" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="800" cy="132" r="92" stroke="#FFB45C" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <text x="800" y="264" text-anchor="middle" fill="#F8EFE4" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="74" font-weight="700">Hivra Invitation Flow</text>
  <text x="800" y="325" text-anchor="middle" fill="#D2D8DF" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="29">
    Secure invitation process that turns a starter into a generative and friendly relationship.
  </text>
  <text x="800" y="368" text-anchor="middle" fill="#A6B3BE" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">
    Acceptance propagates trust. Rejection or burn stops the chain without inheriting the bond.
  </text>

  <g stroke-linecap="round" fill="none">
    <path d="M356 622C492 622 570 622 722 622" stroke="url(#amberLine)" stroke-width="7" marker-end="url(#arrowAmber)"/>
    <path d="M296 650C296 794 296 812 296 940" stroke="url(#amberLine)" stroke-width="7" marker-end="url(#arrowAmber)"/>
    <path d="M388 1040C514 1040 560 1040 678 1040" stroke="url(#amberLine)" stroke-width="7" marker-end="url(#arrowAmber)"/>
    <path d="M948 650C1074 650 1140 650 1240 650" stroke="url(#greenLine)" stroke-width="7" marker-end="url(#arrowGreen)"/>
    <path d="M1292 678C1292 816 1292 858 1292 968" stroke="url(#greenLine)" stroke-width="7" marker-end="url(#arrowGreen)"/>
    <path d="M860 1106C860 1240 860 1280 860 1386" stroke="url(#greenLine)" stroke-width="7" marker-end="url(#arrowGreen)"/>
    <path d="M980 1044C1100 1044 1160 1044 1244 1044" stroke="url(#greenLine)" stroke-width="7" marker-end="url(#arrowGreen)"/>
    <path d="M1292 1162C1292 1298 1292 1360 1292 1492" stroke="url(#greenLine)" stroke-width="7" marker-end="url(#arrowGreen)"/>
    <path d="M1020 1672C1124 1672 1180 1672 1244 1672" stroke="url(#greenLine)" stroke-width="7" marker-end="url(#arrowGreen)"/>
    <path d="M388 1378C544 1378 602 1378 734 1378" stroke="url(#burnLine)" stroke-width="7" marker-end="url(#arrowBurn)"/>
    <path d="M860 1682C860 1796 860 1846 860 1940" stroke="url(#purpleLine)" stroke-width="7" marker-end="url(#arrowPurple)"/>
  </g>

  <g opacity="0.7" filter="url(#softGlow)">
    <path d="M412 1040C564 1000 632 972 722 936" stroke="#FFB25D" stroke-opacity="0.22" stroke-width="4"/>
    <path d="M972 994C1110 940 1190 904 1260 846" stroke="#A4FFA0" stroke-opacity="0.2" stroke-width="4"/>
    <path d="M958 1078C1104 1140 1178 1198 1248 1294" stroke="#8AF18E" stroke-opacity="0.18" stroke-width="4"/>
  </g>

  <g filter="url(#cardShadow)" transform="translate(88 500)">
    <rect width="268" height="148" rx="28" fill="url(#cardAmber)" stroke="#FFB45C" stroke-opacity="0.6" stroke-width="2"/>
    <text x="34" y="50" fill="#F8F1E3" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24" opacity="0.72">ROLE</text>
    <text x="34" y="88" fill="#FFF7EB" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="46" font-weight="700">Inviter</text>
    <text x="34" y="124" fill="#FFD8AA" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">trusted peer holding a starter</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(722 548)">
    <rect width="226" height="112" rx="26" fill="#12151C" stroke="#8FC1FF" stroke-opacity="0.34" stroke-width="2"/>
    <text x="30" y="48" fill="#EEF6FF" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="34" font-weight="700">Starter</text>
    <text x="30" y="82" fill="#B6C5D7" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="22">unique invitation seed</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(1240 530)">
    <rect width="272" height="148" rx="28" fill="url(#cardGreen)" stroke="#86F58A" stroke-opacity="0.6" stroke-width="2"/>
    <text x="34" y="50" fill="#ECFFEE" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24" opacity="0.72">ROLE</text>
    <text x="34" y="88" fill="#F6FFF5" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="46" font-weight="700">Invitee</text>
    <text x="34" y="124" fill="#C3F7C5" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">receives an isolated entry path</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(96 940)">
    <rect width="292" height="152" rx="28" fill="url(#cardAmber)" stroke="#FFB45C" stroke-opacity="0.56" stroke-width="2"/>
    <text x="32" y="58" fill="#FFF6EA" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="40" font-weight="700">Invitation Sent</text>
    <text x="32" y="100" fill="#FFD6A3" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">capsule emits a unique starter</text>
    <text x="32" y="132" fill="#FFBF79" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="20">one path, one chance, one tracked outcome</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(678 900)">
    <rect width="360" height="206" rx="30" fill="#0F151C" stroke="#72D9D0" stroke-opacity="0.44" stroke-width="2"/>
    <rect x="1" y="1" width="358" height="204" rx="29" fill="rgba(255,255,255,0.02)"/>
    <text x="38" y="64" fill="#F2FBFB" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="48" font-weight="700">Capsule</text>
    <text x="38" y="108" fill="#D3ECEB" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">Starters available: 5</text>
    <text x="38" y="146" fill="#96B6B6" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="22">Tracks issuance, acceptance, rejection, and burn.</text>
    <text x="38" y="178" fill="#96B6B6" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="22">Preserves trust logic as relationship memory.</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(1244 970)">
    <rect width="288" height="154" rx="28" fill="url(#cardGreen)" stroke="#86F58A" stroke-opacity="0.6" stroke-width="2"/>
    <text x="34" y="58" fill="#F3FFF3" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="44" font-weight="700">Accepted</text>
    <text x="34" y="102" fill="#C7F5CC" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">invitee generates a fresh</text>
    <text x="34" y="134" fill="#C7F5CC" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">starter for onward trust</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(94 1260)">
    <rect width="294" height="154" rx="28" fill="url(#cardBurn)" stroke="#FF8E60" stroke-opacity="0.6" stroke-width="2"/>
    <text x="34" y="58" fill="#FFF0E8" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="44" font-weight="700">Burned</text>
    <text x="34" y="102" fill="#FFC7AF" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">slot stays empty until a</text>
    <text x="34" y="134" fill="#FFC7AF" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">new issuance cycle begins</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(734 1300)">
    <rect width="252" height="126" rx="26" fill="#12161D" stroke="#86F58A" stroke-opacity="0.3" stroke-width="2"/>
    <text x="34" y="54" fill="#EFFFF1" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="36" font-weight="700">Trust propagates</text>
    <text x="34" y="92" fill="#B8EFC0" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="22">new peer path becomes available</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(694 1550)">
    <rect width="332" height="154" rx="28" fill="url(#cardPurple)" stroke="#D58CFF" stroke-opacity="0.6" stroke-width="2"/>
    <text x="34" y="58" fill="#FFF1FF" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="44" font-weight="700">Rejected</text>
    <text x="34" y="102" fill="#E8CBFF" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">starter is destroyed and</text>
    <text x="34" y="134" fill="#E8CBFF" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">friendly propagation stops</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(1244 1494)">
    <rect width="290" height="206" rx="30" fill="url(#cardGreen)" stroke="#86F58A" stroke-opacity="0.64" stroke-width="2"/>
    <text x="34" y="56" fill="#EFFFF1" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24" opacity="0.78">OUTCOME</text>
    <text x="34" y="102" fill="#F7FFF7" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="40" font-weight="700">Generative</text>
    <text x="34" y="146" fill="#F7FFF7" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="40" font-weight="700">Friendly Bond</text>
    <text x="34" y="182" fill="#C5F5C7" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="22">relationship established</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(694 1940)">
    <rect width="332" height="104" rx="26" fill="#13161C" stroke="#D58CFF" stroke-opacity="0.32" stroke-width="2"/>
    <text x="34" y="63" fill="#F4D7FF" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="32" font-weight="700">No friendly bond is formed</text>
  </g>

  <g transform="translate(110 2070)">
    <rect width="1380" height="84" rx="24" fill="#0F1218" stroke="#21262F" stroke-width="1.5"/>
    <circle cx="42" cy="42" r="10" fill="#FF9A5A"/>
    <text x="66" y="50" fill="#F3DAC6" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="28" font-weight="700">Burned</text>
    <text x="188" y="50" fill="#A4AEB6" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">slot stays empty</text>
    <circle cx="510" cy="42" r="10" fill="#D68DFF"/>
    <text x="534" y="50" fill="#F0DBFF" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="28" font-weight="700">Rejected</text>
    <text x="680" y="50" fill="#A4AEB6" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">starter is destroyed</text>
    <circle cx="1038" cy="42" r="10" fill="#8FF78C"/>
    <text x="1062" y="50" fill="#DBF6DD" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="28" font-weight="700">Accepted</text>
    <text x="1208" y="50" fill="#A4AEB6" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="24">relationship propagates</text>
  </g>
</svg>
